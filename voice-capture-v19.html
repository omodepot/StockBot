<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.box{padding:10px;border-radius:12px;background:#eef2ff;color:#111827;font-size:14px}.status{font-weight:700}.retry{margin-top:7px;border:0;border-radius:9px;padding:9px 12px;background:#2563eb;color:white;font-weight:700}</style></head><body><div class="box"><div class="status" id="status">Voice starting…</div><button class="retry" id="retry" type="button">🎙 Start Listening</button></div><script>
let rec=null,active=false;const status=document.getElementById('status'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function send(type,data={}){parent.postMessage({source:'stockbot-voice-v19',type,...data},location.origin)}
function stop(){active=false;try{rec?.stop()}catch(_){}rec=null}
function start(){if(!SR){status.textContent='Voice recognition is unavailable in this iPhone browser.';send('unsupported');return}stop();try{rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=1;rec.onstart=()=>{active=true;status.textContent='🎙 Listening — say “quantity 3, condition good”';send('listening')};rec.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript?.trim()||'';status.textContent='Heard: “'+text+'”';send('result',{text});active=false};rec.onerror=e=>{active=false;status.textContent='Voice error: '+e.error;send('error',{error:e.error})};rec.onend=()=>{active=false;send('ended')};rec.start()}catch(e){status.textContent='Could not start voice: '+e.message;send('error',{error:e.message})}}
document.getElementById('retry').onclick=start;addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='start')start()});setTimeout(start,350);
</script></body></html>
